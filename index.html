<style>
:root{
  --pink:#FF6FA3; --pink-d:#C93A74; --coral:#FB7A6E; --coral-d:#C44A3F; --mint:#3FBF9C; --mint-d:#1F7F66;
  --lav:#A99BE0; --blue:#5FB0E6; --yellow:#E8B53C;
  --ink:#403E52; --muted:#77718C; --page:#FCF1F6; --card:#FFFAFC; --rule:#EFDCE7;
  --t-pink:#FFDDEA; --t-coral:#FFDCD7; --t-mint:#CFF0E6; --t-lav:#E7E2F7; --t-blue:#DAEEFB; --t-yellow:#FBEBC6;
  --display:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --body:'Nunito','Avenir Next','Segoe UI',sans-serif;
  --r:20px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:400 15px/1.45 var(--body);padding:clamp(12px,2vw,24px);padding-bottom:40px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pink-d)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2.5px solid var(--lav);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(12px,2vw,28px);align-items:center;margin-bottom:14px}
.date .dow{font:700 12px var(--body);text-transform:uppercase;letter-spacing:.12em;color:var(--pink-d)}
.date h1{font-size:clamp(24px,2.6vw,34px);line-height:1.1}
.focus{min-width:0}
.focus .lbl{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.focus-text{font:600 clamp(17px,1.6vw,21px) var(--display);background:none;border:0;padding:2px 0;text-align:left;width:100%}
.focus-text:hover{color:var(--pink-d)}
.focus-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.focus-row input{flex:1 1 220px;min-width:0}
.suggest{font-size:13px;color:var(--muted);margin-top:4px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.sync{font-size:12px;color:var(--muted)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{flex:1 1 200px;display:flex;align-items:baseline;gap:8px;background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:10px 14px;text-align:left}
.stat:hover{border-color:var(--pink)}
.stat b{font:600 22px var(--display)}
.stat .s-l{font-weight:700}
.stat .s-x{font-size:12.5px;color:var(--muted);margin-left:auto;text-align:right}
.meter{height:6px;border-radius:6px;background:var(--t-pink);overflow:hidden;flex:0 0 56px;align-self:center}
.meter i{display:block;height:100%;background:var(--pink);border-radius:6px}

/* ---------- controls ---------- */
.btn{background:var(--t-pink);border:1px solid transparent;border-radius:999px;padding:7px 14px;font-weight:700;color:var(--ink)}
.btn:hover{border-color:var(--pink)}
.btn.primary{background:var(--pink);color:#3A1A28}
.btn.quiet{background:transparent;border-color:var(--rule);font-weight:600}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.danger{background:var(--t-coral);color:var(--coral-d)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{background:#FFFDFE;border:1px solid var(--rule);border-radius:12px;padding:7px 10px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--lav);outline:none}
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pills .p-l{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-right:2px}
.pill{background:transparent;border:1px solid var(--rule);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.pill[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#FFF6FA}
.pill .dot{margin-right:5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:baseline}
.c-pink{background:var(--pink)}.c-coral{background:var(--coral)}.c-mint{background:var(--mint)}.c-lav{background:var(--lav)}.c-blue{background:var(--blue)}.c-yellow{background:var(--yellow)}
.t-pink{background:var(--t-pink)}.t-coral{background:var(--t-coral)}.t-mint{background:var(--t-mint)}.t-lav{background:var(--t-lav)}.t-blue{background:var(--t-blue)}.t-yellow{background:var(--t-yellow)}

/* ---------- layout ---------- */
.banner{background:var(--t-yellow);border-radius:14px;padding:9px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:600}
.banner.err{background:var(--t-coral)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:grid;gap:16px;min-width:0}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:16px;min-width:0;box-shadow:0 1px 2px rgba(64,62,82,.04)}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-h h2{font-size:19px}
.card-h .upd{font-size:12px;color:var(--muted);margin-left:auto;text-align:right}
.icon-btn{background:transparent;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.icon-btn:hover{border-color:var(--pink);color:var(--ink)}
.card.collapsed .card-b{display:none}
.card.collapsed .card-h{margin-bottom:0}
.sub{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:14px 0 6px}
.empty{display:flex;align-items:center;gap:10px;color:var(--muted);padding:8px 2px}
.mascot{width:44px;height:44px;flex:none}
#mini{display:none}

/* ---------- schedule ---------- */
.filters{display:grid;gap:6px;margin-bottom:10px}
.allday{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;background:var(--t-lav)}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tl>li{display:grid;grid-template-columns:74px minmax(0,1fr);gap:10px;border-radius:14px;padding:8px 10px}
.tl .time{font-size:12.5px;font-weight:700;color:var(--muted);line-height:1.3;padding-top:1px}
.tl .ttl{font-weight:700}
.tl .blk{border:1px dotted transparent}
.tl .blk.dim{background:transparent;border-color:var(--rule)}
.tl .blk.dim .ttl{font-weight:600;color:var(--muted)}
.tl .ev{background:#FFFDFE;border:1px solid var(--rule)}
.tl .past{opacity:.5}
.tl .now{border:2px solid var(--pink);opacity:1}
.nowtag{display:inline-block;background:var(--pink);color:#3A1A28;border-radius:999px;font-size:11px;font-weight:800;padding:0 8px;margin-left:6px;vertical-align:middle}
.rem{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.rem span{background:rgba(255,255,255,.7);border-radius:999px;padding:0 8px;font-size:12px;font-weight:600}
.meta{font-size:12.5px;color:var(--muted)}
.feed{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px}
.feed label{display:flex;gap:7px;align-items:flex-start;font-size:13.5px}
.dayhead{font:600 15px var(--display);margin:12px 0 6px}
.dayctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.skip{float:right;margin-left:6px;background:rgba(255,255,255,.6);font-size:11.5px;padding:1px 8px}

/* ---------- tasks ---------- */
.addrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.addrow input[type=text]{flex:1 1 200px}
.tasklist{list-style:none;margin:0;padding:0;display:grid;gap:4px;min-height:34px}
.task{border-radius:12px;background:#FFFDFE;border:1px solid var(--rule)}
.task .row{display:flex;align-items:center;gap:8px;padding:6px 8px;flex-wrap:wrap}
.task[draggable=true] .row{cursor:grab}
.task.dragging{opacity:.4}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-title{flex:1 1 120px;min-width:0;font-weight:600;overflow-wrap:anywhere}
.tag{border-radius:999px;padding:0 9px;font-size:12px;font-weight:700;white-space:nowrap}
.due{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.due.over{color:var(--coral-d)}
.due.today{color:var(--mint-d)}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:2px solid var(--lav);border-radius:7px;background:#FFFDFE;flex:none;margin:0;display:grid;place-content:center;cursor:pointer}
input[type=checkbox]:checked{background:var(--mint);border-color:var(--mint)}
input[type=checkbox]:checked::after{content:"";width:9px;height:5px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.edit{border-top:1px dotted var(--rule);padding:8px;display:grid;gap:8px}
.edit .f{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.edit label{font-size:12px;font-weight:700;color:var(--muted)}
.edit input[type=text]{flex:1 1 180px}
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quad{border-radius:16px;padding:10px;min-height:110px;border:2px dashed transparent}
.quad h3{font-size:15px}
.quad .q-s{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.zone.over{border-color:var(--pink)}
.backlog{border:2px dashed transparent;border-radius:14px;margin:-2px;padding:2px}

/* ---------- trackers ---------- */
.trk{display:grid;gap:8px}
.trk .line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.trk .name{font-weight:700;flex:0 0 90px}
.trk .val{font:600 17px var(--display);min-width:54px;white-space:nowrap}
.tog{border:1.5px solid var(--rule);background:#FFFDFE;border-radius:999px;padding:4px 12px;font-weight:700;color:var(--muted)}
.tog[aria-pressed=true]{background:var(--t-mint);border-color:var(--mint);color:var(--mint-d)}
.step{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--rule);background:#FFFDFE;font-weight:800}
.step:hover,.tog:hover{border-color:var(--pink)}
.drops{display:flex;gap:3px}
.drops i{width:10px;height:14px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:var(--t-blue)}
.drops i.on{background:var(--blue)}
.drops.walk i{width:13px;height:13px;border-radius:50%;background:var(--t-mint)}
.drops.walk i.on{background:var(--mint)}
.hgrid{display:grid;gap:3px;align-items:center;margin-top:4px}
.hgrid .hl{font-size:12px;font-weight:700;white-space:nowrap;padding-right:6px}
.hgrid .hd{font-size:10.5px;font-weight:700;color:var(--muted);text-align:center;background:none;border:0;padding:2px 0;border-radius:6px}
.hgrid .hd.sel{background:var(--ink);color:#FFF6FA}
.cell{height:16px;border-radius:5px;border:1px solid var(--rule);padding:0;min-width:0}
.cell:not(.l1):not(.l2){background:transparent}
.cell.na{border-style:dotted;opacity:.5}
.cell.l1{border-color:transparent;opacity:.45}
.cell.l2{border-color:transparent}
.bars{display:grid;gap:3px;align-items:end;height:74px;margin-top:6px;border-bottom:1px dotted var(--rule)}
.bars button{background:var(--lav);border:0;border-radius:5px 5px 0 0;padding:0;min-height:0}
.bars button.zero{background:transparent}
.barlab{display:grid;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);text-align:center}

/* ---------- notes ---------- */
.cap{display:grid;gap:6px;margin-bottom:10px}
.cap .f{display:flex;gap:6px}
.cap input{flex:1}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.note{background:#FFFDFE;border:1px solid var(--rule);border-radius:12px;padding:7px 10px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.note .n-t{flex:1 1 150px;min-width:0;overflow-wrap:anywhere}
.note .n-a{display:flex;gap:4px;margin-left:auto}

/* ---------- settings ---------- */
#settings{position:fixed;inset:0 0 0 auto;width:min(480px,100%);background:var(--card);border-left:1px solid var(--rule);padding:18px;overflow:auto;z-index:20;box-shadow:-8px 0 30px rgba(64,62,82,.08)}
#settings h2{font-size:21px}
#settings h3{font-size:16px;margin:20px 0 6px}
#settings p{margin:4px 0 8px;color:var(--muted);font-size:13.5px}
.srow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.srow input[type=text]{flex:1 1 120px}
.blkrow{border:1px dotted var(--rule);border-radius:12px;padding:8px;margin-bottom:6px;display:grid;gap:6px}
.blkrow label{font-size:12px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.blkrow label input[type=text]{flex:1}

/* ---------- phone ---------- */
.tabs{display:none}
@media (max-width:1180px) and (min-width:861px){
  .grid{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
  .grid>.col{grid-column:1/-1;grid-template-columns:1fr 1fr;align-items:start}
}
@media (max-width:860px){
  body{padding-bottom:86px}
  .top{grid-template-columns:1fr auto}
  .focus{grid-column:1/-1;grid-row:2}
  .sync{display:none}
  .grid{grid-template-columns:minmax(0,1fr)}
  #mini{display:block}
  [data-tabs]{display:none!important}
  body[data-tab=today] [data-tabs~=today],body[data-tab=schedule] [data-tabs~=schedule],
  body[data-tab=tasks] [data-tabs~=tasks],body[data-tab=notes] [data-tabs~=notes]{display:block!important}
  body[data-tab=today] .stats[data-tabs]{display:flex!important}
  .stat{flex:1 1 100%}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--rule);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10;gap:4px}
  .tabs button{background:transparent;border:0;border-radius:14px;padding:9px 4px;font-weight:800;color:var(--muted)}
  .tabs button[aria-current=page]{background:var(--t-pink);color:var(--ink)}
  .task .row{padding:9px 8px}
  .tl>li{grid-template-columns:64px minmax(0,1fr)}
}
@media (max-width:520px){.matrix{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.btn,.pill,.stat,.tog{transition:border-color .15s ease-out,background .15s ease-out}}
</style>
</head>
<body data-tab="today">

<header class="top">
  <div class="date"><div class="dow" id="dow"></div><h1 id="dateStr"></h1></div>
  <div class="focus" id="focusBox"></div>
  <div class="top-actions">
    <span class="sync" id="sync" role="status"></span>
    <button class="btn quiet" data-act="refresh" data-what="all">↻ Refresh all</button>
    <button class="btn quiet" data-act="settings">Settings</button>
  </div>
</header>

<div class="stats" id="stats" data-tabs="today"></div>
<div id="banner"></div>

<main class="grid">
  <section class="card" id="mini" data-tabs="today" aria-label="Right now"></section>

  <section class="card" id="sched" data-tabs="schedule">
    <div class="card-h"><h2>Schedule</h2><span class="upd" id="schedUpd"></span>
      <button class="icon-btn" data-act="refresh" data-what="cal">↻ Refresh</button>
      <button class="icon-btn" data-act="collapse" data-id="sched">Hide</button></div>
    <div class="card-b"><div class="filters" id="schedFilters"></div><div id="schedBody"></div></div>
  </section>

  <section class="card" id="tasks" data-tabs="tasks">
    <div class="card-h"><h2>Tasks</h2><span class="upd" id="taskUpd"></span>
      <button class="icon-btn" data-act="refresh" data-what="data">↻ Refresh</button>
      <button class="icon-btn" data-act="collapse" data-id="tasks">Hide</button></div>
    <div class="card-b">
      <form class="addrow" id="taskForm" autocomplete="off"></form>
      <div class="filters" id="taskFilters"></div>
      <div class="sub">Eisenhower matrix <span style="text-transform:none;letter-spacing:0;font-weight:600">(drag a task in, or use Edit to move it)</span></div>
      <div class="matrix" id="matrix"></div>
      <div class="sub">Backlog <span id="backlogN"></span></div>
      <div class="backlog zone" data-zone="backlog"><ul class="tasklist" id="backlog"></ul></div>
    </div>
  </section>

  <div class="col">
    <section class="card" id="track" data-tabs="today">
      <div class="card-h"><h2>Trackers</h2><span class="upd" id="trackUpd"></span>
        <button class="icon-btn" data-act="refresh" data-what="data">↻ Refresh</button>
        <button class="icon-btn" data-act="collapse" data-id="track">Hide</button></div>
      <div class="card-b" id="trackBody"></div>
    </section>
    <section class="card" id="notes" data-tabs="notes">
      <div class="card-h"><h2>Notes</h2><span class="upd"></span>
        <button class="icon-btn" data-act="refresh" data-what="data">↻ Refresh</button>
        <button class="icon-btn" data-act="collapse" data-id="notes">Hide</button></div>
      <div class="card-b">
        <form class="cap" id="capForm" autocomplete="off">
          <div class="pills" id="capTypes"></div>
          <div class="f"><input type="text" id="capText" aria-label="Quick capture" placeholder="Jot a note, paste a link, or name a next action"><button class="btn primary">Save</button></div>
        </form>
        <div class="filters" id="noteFilters"></div>
        <ul class="notes" id="noteList"></ul>
      </div>
    </section>
  </div>
</main>

<aside id="settings" hidden aria-label="Settings"></aside>

<nav class="tabs" aria-label="Sections">
  <button data-act="tab" data-tab="today">Today</button>
  <button data-act="tab" data-tab="schedule">Schedule</button>
  <button data-act="tab" data-tab="tasks">Tasks</button>
  <button data-act="tab" data-tab="notes">Notes</button>
</nav>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
'use strict';
/* ===================== helpers ===================== */
const SCOPES='https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/drive.file';
const SHEET_NAME='Daily Dashboard Data';
const SH='https://sheets.googleapis.com/v4/spreadsheets', CAL='https://www.googleapis.com/calendar/v3';
const COLORS=['pink','blue','mint','lav','yellow','coral'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={
  get(k,d){try{const v=localStorage.getItem('dash.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('dash.'+k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem('dash.'+k)}catch(e){}}
};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const hm=s=>{const [h,m]=String(s||'0:0').split(':').map(Number);return (h||0)*60+(m||0)};
const fmtMin=m=>new Date(2000,0,1,Math.floor(m/60),m%60).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const fmtClock=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const fmtDay=d=>d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});
const fmtShort=d=>d.toLocaleDateString([],{month:'short',day:'numeric'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const truthy=v=>v===true||/^(true|1|yes|x|y)$/i.test(String(v??'').trim());

function cleanDate(v){ // accepts 2026-11-21 or 11/21/2026 (if typed straight into the Sheet)
  v=String(v??'').trim(); if(!v)return '';
  let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m)return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);

}

/* ===================== rows <-> state ===================== */
function toRows(tab){
  if(tab==='Tasks')return S.tasks.map(t=>[t.id,t.title,t.category,t.due||'',t.quadrant,t.done?'TRUE':'FALSE',t.created||'',t.completed||'']);
  if(tab==='Notes')return S.notes.map(n=>[n.id,n.type,n.text,n.created||'']);
  if(tab==='Log')return Object.keys(S.log).sort().map(d=>{const l=S.log[d];return [d,l.reading??'',l.journal?'TRUE':'FALSE',l.water??'',l.jobsearch?'TRUE':'FALSE',l.teeth_am?'TRUE':'FALSE',l.teeth_pm?'TRUE':'FALSE',l.shower?'TRUE':'FALSE',l.walks??'']});
  if(tab==='Focus')return Object.keys(S.focus).sort().map(d=>[d,S.focus[d]]);
  if(tab==='Settings')return Object.keys(S.settings).map(k=>[k,JSON.stringify(S.settings[k])]);
  return [];
}
function fromRows(tab,rows){
  let fixed=false;
  if(tab==='Tasks'){
    S.tasks=rows.filter(r=>r&&(r[1]||'').trim()).map(r=>{
      if(!r[0])fixed=true;
      const q=String(r[4]||'').toLowerCase().trim();
      return {id:r[0]||uid(),title:String(r[1]).trim(),category:r[2]||'Personal',due:cleanDate(r[3]),
        quadrant:QUADS.some(x=>x.k===q)?q:'backlog',done:truthy(r[5]),created:r[6]||S.today,completed:r[7]||''};
    });
  }else if(tab==='Notes'){
    S.notes=rows.filter(r=>r&&(r[2]||'').trim()).map(r=>{if(!r[0])fixed=true;return {id:r[0]||uid(),type:['note','link','action'].includes(r[1])?r[1]:'note',text:String(r[2]),created:r[3]||S.today}});
  }else if(tab==='Log'){
    S.log={};rows.forEach(r=>{const d=cleanDate(r&&r[0]);if(d)S.log[d]={reading:num(r[1]),journal:truthy(r[2]),water:num(r[3]),jobsearch:truthy(r[4]),teeth_am:truthy(r[5]),teeth_pm:truthy(r[6]),shower:truthy(r[7]),walks:num(r[8])}});
  }else if(tab==='Focus'){
    S.focus={};rows.forEach(r=>{const d=cleanDate(r&&r[0]);if(d&&r[1])S.focus[d]=String(r[1])});
  }else if(tab==='Settings'){
    const s=DEFAULTS();let any=false;
    rows.forEach(r=>{if(r&&r[0]&&r[0] in s){try{s[r[0]]=JSON.parse(r[1]);any=true}catch(e){}}});
    S.settings=s; if(!any)fixed=true;
  }
  return fixed;
}

function cache(){LS.set(cacheKey(),{tasks:S.tasks,notes:S.notes,log:S.log,focus:S.focus,settings:S.settings})}
function loadCache(){

  if(c){S.tasks=c.tasks||[];S.notes=c.notes||[];S.log=c.log||{};S.focus=c.focus||{};S.settings=Object.assign(DEFAULTS(),c.settings||{})}

/* ===================== Google: sign-in ===================== */
class AuthErr extends Error{}
function signIn(){
  if(!clientId()){openSettings();return}
  if(!(window.google&&google.accounts&&google.accounts.oauth2)){banner('Google sign-in is still loading. Try again in a moment.','err');return}
  if(!tokenClient)tokenClient=google.accounts.oauth2.initTokenClient({client_id:clientId(),scope:SCOPES,callback:onToken,
    error_callback:e=>banner('Sign-in did not finish'+(e&&e.type==='popup_failed_to_open'?': the popup was blocked. Allow popups for this page and try again.':'.'),'err')});
  tokenClient.requestAccessToken({prompt:''});
}
function onToken(r){
  if(!r||r.error){banner('Google sign-in was not completed.','err');return}
  const need=SCOPES.split(' ');
  if(!google.accounts.oauth2.hasGrantedAllScopes(r,...need)){banner('Both boxes need to be ticked on the Google screen (view calendar, and manage the dashboard\'s own file). Tap Connect to try again.','err');return}
  token={access_token:r.access_token,exp:Date.now()+(Number(r.expires_in||3600)-90)*1000};LS.set('token',token);
  if(S.mode!=='google'){S.mode='google';LS.set('mode','google');dirty.clear();LS.set('dirty',[]);loadCache();S.events=LS.get('events',[]);S.calendars=LS.get('cals',[])}
  banner('');renderAll();refreshAll();
}
function disconnect(){
  token=null;LS.del('token');S.mode='demo';LS.set('mode','demo');S.events=[];S.calendars=[];
  loadCache();demoCalendar();renderAll();renderSettings();
}
async function gfetch(url,opt={}){
  if(!tokenOk())throw new AuthErr('Sign-in expired');
  const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+token.access_token,'Content-Type':'application/json'}});
  if(r.status===401){token=null;LS.del('token');throw new AuthErr('Sign-in expired')}
  if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}const er=new Error(m||('Google returned an error ('+r.status+')'));er.status=r.status;throw er}
  return r.status===204?null:r.json();
}

/* ===================== Google: Sheet storage ===================== */
async function ensureSheet(){
  let id=LS.get('sheetId','');if(id)return id;
  const q=encodeURIComponent(`name='${SHEET_NAME}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`);
  const f=await gfetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&orderBy=createdTime`);
  if(f.files&&f.files.length)id=f.files[0].id;
  else{
    const c=await gfetch(SH,{method:'POST',body:JSON.stringify({properties:{title:SHEET_NAME},sheets:Object.keys(TABS).map(t=>({properties:{title:t,gridProperties:{frozenRowCount:1}}}))})});
    id=c.spreadsheetId;
    await gfetch(`${SH}/${id}/values:batchUpdate`,{method:'POST',body:JSON.stringify({valueInputOption:'RAW',data:Object.keys(TABS).map(t=>({range:t+'!A1',values:[TABS[t]]}))})});
  }
  LS.set('sheetId',id);return id;
}
async function loadSheet(retry){
  let id;
  try{
    id=await ensureSheet();
    const q=Object.keys(TABS).map(t=>'ranges='+encodeURIComponent(t+'!A2:Z')).join('&');
    const r=await gfetch(`${SH}/${id}/values:batchGet?${q}`);
    Object.keys(TABS).forEach((t,i)=>{
      if(dirty.has(t))return; // never overwrite edits that have not been saved yet
      const rows=(r.valueRanges[i]&&r.valueRanges[i].values)||[];rowCount[t]=rows.length;
      if(fromRows(t,rows))dirty.add(t);
    });
    S.dataAt=Date.now();S.dataErr='';cache();
    if(dirty.size){LS.set('dirty',[...dirty]);flush()}
  }catch(e){
    if(e.status===404&&!retry){LS.del('sheetId');return loadSheet(true)}
    throw e;
  }
}
async function flush(){
  if(flushing||!dirty.size||S.mode!=='google')return;
  if(!tokenOk()){setSync();showAuthBanner();return}
  flushing=true;setSync();
  try{
    const id=await ensureSheet();
    for(const tab of [...dirty]){
      const rows=toRows(tab),w=TABS[tab].length;
      if(rowCount[tab]==null){const cur=await gfetch(`${SH}/${id}/values/${tab}!A2:A`);rowCount[tab]=(cur.values||[]).length}
      const out=rows.slice();for(let i=rows.length;i<rowCount[tab];i++)out.push(Array(w).fill('')); // blank out leftover rows in the same write
      const v=ver[tab];
      await gfetch(`${SH}/${id}/values/${tab}!A1?valueInputOption=RAW`,{method:'PUT',body:JSON.stringify({values:[TABS[tab],...out]})});
      rowCount[tab]=rows.length;
      if(ver[tab]===v)dirty.delete(tab); // edited again while saving? keep it marked and save once more
    }
    S.dataErr='';S.dataAt=Date.now();
  }catch(e){S.dataErr=e instanceof AuthErr?'':e.message;if(e instanceof AuthErr)showAuthBanner()}
  LS.set('dirty',[...dirty]);flushing=false;setSync();
  if(dirty.size&&tokenOk()&&!S.dataErr){clearTimeout(flushTimer);flushTimer=setTimeout(flush,900)}
}

function normEvent(it,calId){
  if(!it||it.status==='cancelled'||!it.start)return null;
  const me=(it.attendees||[]).find(a=>a.self);if(me&&me.responseStatus==='declined')return null;
  const allDay=!!it.start.date;
  const st=allDay?pd(it.start.date):new Date(it.start.dateTime),en=allDay?pd(it.end.date):new Date(it.end.dateTime);
  return {id:it.id,title:it.summary||'(busy)',start:+st,end:+en,allDay,calId,link:/^https:\/\//.test(it.htmlLink||'')?it.htmlLink:'',where:it.location||''};
}
const calOn=c=>c.id in S.settings.calendars?!!S.settings.calendars[c.id]:c.selected;
const shownCals=()=>S.calendars.filter(calOn);
const calColor=id=>{const i=shownCals().findIndex(c=>c.id===id);return COLORS[(i<0?0:i)%COLORS.length]};
async function loadCalendar(){
  try{
    const cl=await gfetch(CAL+'/users/me/calendarList?minAccessRole=reader&maxResults=250');
    S.calendars=(cl.items||[]).map(c=>({id:c.id,name:c.summaryOverride||c.summary||c.id,primary:!!c.primary,selected:c.primary||c.selected===true}))
      .sort((a,b)=>(b.primary-a.primary)||a.name.localeCompare(b.name));
    const t0=sod(new Date()),t1=addDays(t0,8);let failed=[];
    const res=await Promise.all(shownCals().map(c=>gfetch(`${CAL}/calendars/${encodeURIComponent(c.id)}/events?singleEvents=true&orderBy=startTime&maxResults=250&timeMin=${encodeURIComponent(t0.toISOString())}&timeMax=${encodeURIComponent(t1.toISOString())}`)
      .then(r=>(r.items||[]).map(it=>normEvent(it,c.id)).filter(Boolean)).catch(e=>{if(e instanceof AuthErr)throw e;failed.push(c.name);return null})));
    // keep last-known events for any calendar that failed, never blank them out
    const keep=S.events.filter(e=>shownCals().some((c,i)=>c.id===e.calId&&res[i]===null));
    S.events=res.filter(Boolean).flat().concat(keep);
    S.eventsErr=failed.length?'Could not refresh: '+failed.join(', ')+'. Showing the last known events for those.':'';
    if(!failed.length)S.eventsAt=Date.now();
    LS.set('events',S.events);LS.set('cals',S.calendars);LS.set('eventsAt',S.eventsAt);
  }catch(e){if(e instanceof AuthErr)throw e;S.eventsErr='Could not load your calendar ('+e.message+').'}
}
function eventsOn(d){
  const a=+sod(d),z=a+864e5,hide=S.ui.hiddenCals,ok=new Set(shownCals().map(c=>c.id));
  return S.events.filter(e=>ok.has(e.calId)&&!hide.includes(e.calId)&&e.start<z&&e.end>a).sort((x,y)=>x.start-y.start);
}

/* ===================== refresh ===================== */
async function refreshAll(what='all'){
  if(S.mode!=='google'){if(what!=='data')demoCalendar();S.dataAt=Date.now();renderAll();return}
  if(!tokenOk()){showAuthBanner();renderAll();return}
  if(loading)return;loading=true;setSync();
  try{
    const jobs=[];
    if(what!=='cal')jobs.push((async()=>{if(dirty.size)await flush();await loadSheet()})().catch(e=>{if(e instanceof AuthErr)throw e;S.dataErr=e.message}));
    if(what!=='data')jobs.push(loadCalendar());
    await Promise.all(jobs);
  }catch(e){if(e instanceof AuthErr)showAuthBanner();else S.dataErr=e.message}
  loading=false;renderAll();
}

/* ===================== task + tracker logic ===================== */
const catOf=n=>S.settings.categories.find(c=>c.name===n)||{name:n,color:'lav'};
const isOver=t=>!t.done&&t.due&&t.due<S.today;
const taskSort=(a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||(a.created||'').localeCompare(b.created||'')||a.id.localeCompare(b.id);
function passes(t){
  const u=S.ui;
  if(u.cat!=='all'&&t.category!==u.cat)return false;
  if(u.status==='open'&&t.done)return false;
  if(u.status==='done'&&!t.done)return false;
  if(u.status==='overdue'&&!isOver(t))return false;
  if(u.due==='today'&&!(t.due&&t.due<=S.today))return false;
  if(u.due==='week'&&!(t.due&&t.due<=ymd(addDays(pd(S.today),7))))return false;
  return true;
}
const topTasks=n=>S.tasks.filter(t=>!t.done&&(t.quadrant==='do'||(t.due&&t.due<=S.today))).sort((a,b)=>((a.quadrant==='do'?0:1)-(b.quadrant==='do'?0:1))||taskSort(a,b)).slice(0,n);
function feedTasks(b){
  const cats=String(b.feed||'').split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);if(!cats.length)return [];
  const rank={do:0,schedule:1,backlog:2,delegate:3,drop:4};
  return S.tasks.filter(t=>!t.done&&cats.includes(t.category.toLowerCase())).sort((a,b)=>(rank[a.quadrant]-rank[b.quadrant])||taskSort(a,b)).slice(0,2);
}
const goals=()=>Object.assign({water:8,reading:20,walks:2},S.settings.goals);
function logOf(d,make){if(!S.log[d]&&make)S.log[d]={reading:null,journal:false,water:null,jobsearch:false,teeth_am:false,teeth_pm:false,shower:false,walks:null};return S.log[d]}
// level: null = no entry, 0 = not done, 1 = partly, 2 = done
function level(k,d){
  const l=S.log[d],g=goals();if(!l)return null;
  if(k==='reading')return l.reading==null?null:l.reading>=g.reading?2:l.reading>0?1:0;
  if(k==='water')return l.water==null?null:l.water>=g.water?2:l.water>0?1:0;
  if(k==='walks')return l.walks==null?null:l.walks>=g.walks?2:l.walks>0?1:0;
  if(k==='teeth')return (l.teeth_am?1:0)+(l.teeth_pm?1:0);
  return l[k]?2:0;
}
function dayScore(d){
  const wd=pd(d).getDay()%6!==0&&!isOff(d),l=S.log[d]||{},g=goals();let hit=0,poss=7;
  if((l.reading||0)>=g.reading)hit++; if(l.journal)hit++; if((l.water||0)>=g.water)hit++; if((l.walks||0)>=g.walks)hit++;
  if(l.teeth_am)hit++; if(l.teeth_pm)hit++; if(l.shower)hit++;
  if(wd){poss++;if(l.jobsearch)hit++}
  return [hit,poss];
}
function weekStart(){const t=pd(S.today);return addDays(t,-((t.getDay()+6)%7))}
function weekScore(){let h=0,p=0;for(let d=weekStart();ymd(d)<=S.today;d=addDays(d,1)){const [a,b]=dayScore(ymd(d));h+=a;p+=b}return p?Math.round(100*h/p):0}
function streak(k){let n=0,d=pd(S.today);if(!(S.log[S.today]||{})[k])d=addDays(d,-1);while((S.log[ymd(d)]||{})[k]){n++;d=addDays(d,-1)}return n}

function renderTop(){

  $('dow').textContent=now.toLocaleDateString([],{weekday:'long'});
  $('dateStr').textContent=now.toLocaleDateString([],{month:'long',day:'numeric'});
  const f=S.focus[S.today],box=$('focusBox');
  if(document.activeElement&&document.activeElement.id==='focusIn')return renderStats();
  if(f&&!S.editFocus){
    box.innerHTML=`<div class="lbl">Today's focus</div><button class="focus-text" data-act="editFocus" title="Change today's focus">${esc(f)}</button>`;
  }else{
    const sug=S.tasks.filter(t=>!t.done&&t.quadrant==='do').sort(taskSort)[0];
    box.innerHTML=`<div class="lbl">Today's focus</div>
      <form class="focus-row" id="focusForm" autocomplete="off"><input type="text" id="focusIn" aria-label="Today's focus" placeholder="What matters most today?" value="${esc(f||'')}"><button class="btn primary">Set</button></form>
      ${sug&&!f?`<div class="suggest">Suggestion: <b>${esc(sug.title)}</b> <button class="btn sm" data-act="useFocus" data-id="${sug.id}">Use this</button></div>`:''}`;
  }
  renderStats();
}
function renderStats(){
  const open=S.tasks.filter(t=>!t.done),over=open.filter(isOver).length,doneToday=S.tasks.filter(t=>t.done&&t.completed===S.today).length;
  const today=pd(S.today),timed=eventsOn(today).filter(e=>!e.allDay),next=timed.find(e=>e.start>Date.now());

/* ===================== render: schedule ===================== */
function dayView(d){
  const isToday=ymd(d)===S.today,now=new Date(),nowM=isToday?now.getHours()*60+now.getMinutes():-1;
  const evs=eventsOn(d),all=evs.filter(e=>e.allDay),timed=evs.filter(e=>!e.allDay),ds=+sod(d);
  const span=e=>[Math.max(0,Math.round((e.start-ds)/6e4)),Math.min(1440,Math.round((e.end-ds)/6e4))];
  const items=[],key=ymd(d),weekday=d.getDay()>=1&&d.getDay()<=5,off=isOff(key),skip=(S.settings.skipped||{})[key]||[];
  if(weekday&&!off)S.settings.blocks.filter(b=>!skip.includes(blockKey(b))).forEach(b=>{
    const s=hm(b.start),e=hm(b.end);let ov=0;timed.forEach(ev=>{const [a,z]=span(ev);ov+=Math.max(0,Math.min(e,z)-Math.max(s,a))});
    items.push({k:'b',s,e,b,dim:e>s&&ov/(e-s)>=.5});
  });
  timed.forEach(ev=>{const [a,z]=span(ev);items.push({k:'e',s:a,e:z,ev})});
  items.sort((x,y)=>x.s-y.s||(x.k==='b'?-1:1));
  items.forEach(it=>{it.today=isToday;it.day=key;it.state=nowM<0?'':it.e<=nowM?'past':it.s<=nowM?'now':''});
  return {all,items,key,weekday,off,skipped:off?0:skip.length};
}
const blockKey=b=>b.start+'|'+b.title;
const isOff=k=>(S.settings.daysOff||[]).includes(k);
function itemHtml(it,i){
  const time=`<div class="time">${fmtMin(it.s)}<br>${fmtMin(it.e%1440)}</div>`,tag=it.state==='now'?'<span class="nowtag">now</span>':'';
  if(it.k==='e'){
    const e=it.ev,c=S.calendars.find(c=>c.id===e.calId);
    return `<li class="ev ${it.state}">${time}<div><div class="ttl"><span class="dot c-${calColor(e.calId)}"></span> ${e.link?`<a href="${esc(e.link)}" target="_blank" rel="noopener">${esc(e.title)}</a>`:esc(e.title)}${tag}</div>
      <div class="meta">${esc(c?c.name:'Calendar')}${e.where?' · '+esc(e.where):''}</div></div></li>`;
  }
  const b=it.b,tints=['t-lav','t-mint','t-blue','t-yellow','t-pink'],rem=String(b.rem||'').split(',').map(s=>s.trim()).filter(Boolean);
  const feed=it.dim||!it.today?[]:feedTasks(b); // task suggestions only make sense for today
  return `<li class="blk ${it.dim?'dim':tints[i%tints.length]} ${it.state}">${time}<div><button type="button" class="icon-btn skip" data-act="skipBlock" data-d="${it.day}" data-k="${esc(blockKey(b))}" aria-label="Skip ${esc(b.title)} on this day only">Skip</button><div class="ttl">${esc(b.title)}${tag}</div>
    ${it.dim?'<div class="meta">A meeting covers most of this block.</div>':''}
    ${rem.length&&!it.dim?`<div class="rem">${rem.map(r=>`<span>${esc(r)}</span>`).join('')}</div>`:''}
    ${feed.length?`<ul class="feed">${feed.map(t=>`<li><label><input type="checkbox" data-chg="toggleTask" data-id="${t.id}"><span>${esc(t.title)} <span class="meta">${esc(t.category)}</span></span></label></li>`).join('')}</ul>`:''}</div></li>`;
}
function dayHtml(d,blended,quiet){
  const v=dayView(d);let items=v.items;if(!blended)items=items.filter(i=>i.k==='e');
  let h='';
  if(v.weekday)h+=v.off
    ?`<div class="dayctl"><span class="chip t-mint">Day off</span><span class="meta">Base schedule hidden. Calendar events still show.</span><button type="button" class="icon-btn" data-act="dayOff" data-v="${v.key}">Make it a workday again</button></div>`
    :`<div class="dayctl"><button type="button" class="icon-btn" data-act="dayOff" data-v="${v.key}">Take this day off</button>${v.skipped?`<span class="meta">${v.skipped} block${v.skipped===1?'':'s'} skipped</span><button type="button" class="icon-btn" data-act="restoreBlocks" data-v="${v.key}">Restore</button>`:''}</div>`;
  h+=v.all.length?`<div class="allday">${v.all.map(e=>`<span class="chip"><span class="dot c-${calColor(e.calId)}"></span> ${esc(e.title)}</span>`).join('')}</div>`:'';
  let bi=0;
  h+=items.length?`<ul class="tl">${items.map(it=>itemHtml(it,it.k==='b'?bi++:0)).join('')}</ul>`:(v.all.length?'':blended&&!quiet?empty('Nothing on the calendar. A wide open day.',true):'<div class="meta">Nothing scheduled.</div>');
  return h;
}

  if(t.due===S.today)return `<span class="due today">due today</span>`;
  return `<span class="due">${t.due===tm?'tomorrow':fmtShort(pd(t.due))}</span>`;

}

function renderAll(){
  document.querySelectorAll('.card').forEach(c=>{const on=S.ui.collapsed.includes(c.id);c.classList.toggle('collapsed',on);const b=c.querySelector('[data-act=collapse]');if(b){b.textContent=on?'Show':'Hide';b.setAttribute('aria-expanded',String(!on))}});
  document.querySelectorAll('.tabs button').forEach(b=>b.dataset.tab===document.body.dataset.tab?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  renderTop();renderSchedule();renderMini();renderTasks();renderTrackers();renderNotes();setSync();
  if(!$('banner').querySelector('[role=alert]'))banner('');
}
const afterTasks=()=>{save('Tasks');renderTop();renderSchedule();renderMini();renderTasks()};
function afterDay(){ // drop entries for days already gone, then save and redraw
  const cut=ymd(addDays(pd(S.today),-1)),st=S.settings;
  st.daysOff=(st.daysOff||[]).filter(x=>x>=cut);Object.keys(st.skipped||{}).forEach(k=>{if(k<cut)delete st.skipped[k]});
  save('Settings');renderSchedule();renderMini();renderStats();
}
const afterLog=()=>{save('Log');renderStats();renderTrackers()};

/* ===================== actions ===================== */
const task=id=>S.tasks.find(t=>t.id===id);
function moveTask(id,q){const t=task(id);if(t&&t.quadrant!==q){t.quadrant=q;afterTasks()}}
const ACT={
  signin:signIn, settings:openSettings, disconnect,
  closeSettings(){$('settings').hidden=true},
  saveCid(){LS.set('clientId',$('cidIn').value.trim());renderSettings();banner('')},
  refresh(el){refreshAll(el.dataset.what)},
  collapse(el){const i=S.ui.collapsed.indexOf(el.dataset.id);i<0?S.ui.collapsed.push(el.dataset.id):S.ui.collapsed.splice(i,1);saveUi();renderAll()},
  tab(el){document.body.dataset.tab=el.dataset.tab;window.scrollTo(0,0);renderAll()},
  go(el){document.body.dataset.tab=el.dataset.tab;const i=S.ui.collapsed.indexOf(el.dataset.to);if(i>=0)S.ui.collapsed.splice(i,1);if(el.dataset.to==='tasks'){S.ui.status=el.dataset.status||'open';S.ui.cat='all';S.ui.due='any';saveUi()}renderAll();$(el.dataset.to).scrollIntoView({behavior:'smooth',block:'start'})},
  editFocus(){S.editFocus=true;renderTop();$('focusIn').focus()},
  useFocus(el){const t=task(el.dataset.id);if(t){S.focus[S.today]=t.title;S.editFocus=false;save('Focus');renderTop()}},
  dayOff(el){const a=S.settings.daysOff=S.settings.daysOff||[],v=el.dataset.v,i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);afterDay()},
  skipBlock(el){const m=S.settings.skipped=S.settings.skipped||{},d=el.dataset.d;(m[d]=m[d]||[]).push(el.dataset.k);afterDay()},
  restoreBlocks(el){delete (S.settings.skipped||{})[el.dataset.v];afterDay()},
  range(el){S.ui.range=el.dataset.v;saveUi();renderSchedule()},
  cal(el){const i=S.ui.hiddenCals.indexOf(el.dataset.v);i<0?S.ui.hiddenCals.push(el.dataset.v):S.ui.hiddenCals.splice(i,1);saveUi();renderSchedule();renderMini();renderStats()},
  fcat(el){S.ui.cat=el.dataset.v;saveUi();renderTasks();newHint()},
  clearFilters(){S.ui.cat='all';S.ui.status='open';S.ui.due='any';saveUi();renderTasks();newHint()},
  fstatus(el){S.ui.status=el.dataset.v;saveUi();renderTasks()},
  fdue(el){S.ui.due=el.dataset.v;saveUi();renderTasks()},
  openTask(el){S.openTask=S.openTask===el.dataset.id?null:el.dataset.id;renderTasks()},
  moveTask(el){moveTask(el.dataset.id,el.dataset.v)},
  setCat(el){const t=task(el.dataset.id);if(t&&t.category!==el.dataset.v){t.category=el.dataset.v;afterTasks()}},
  delTask(el){S.tasks=S.tasks.filter(t=>t.id!==el.dataset.id);S.openTask=null;afterTasks()},
  read(el){const l=logOf(S.trackDate,true);l.reading=Math.max(0,(l.reading||0)+Number(el.dataset.v));afterLog()},
  water(el){const l=logOf(S.trackDate,true);l.water=Math.max(0,(l.water||0)+Number(el.dataset.v));afterLog()},
  walks(el){const l=logOf(S.trackDate,true);l.walks=Math.max(0,(l.walks||0)+Number(el.dataset.v));afterLog()},
  tog(el){const l=logOf(S.trackDate,true);l[el.dataset.k]=!l[el.dataset.k];afterLog()},
  trackDay(el){S.trackDate=el.dataset.v;renderTrackers()},
  trange(el){S.ui.trackRange=el.dataset.v;saveUi();renderTrackers()},
  cap(el){S.ui.cap=el.dataset.v;saveUi();renderNotes();$('capText').focus()},
  fnote(el){S.ui.noteType=el.dataset.v;saveUi();renderNotes()},
  delNote(el){S.notes=S.notes.filter(n=>n.id!==el.dataset.id);save('Notes');renderNotes()},
  noteToTask(el){const n=S.notes.find(n=>n.id===el.dataset.id);if(!n)return;S.tasks.push({id:uid(),title:n.text,category:'Personal',due:'',quadrant:'backlog',done:false,created:S.today,completed:''});
    S.notes=S.notes.filter(x=>x!==n);save('Notes');afterTasks();renderNotes()},
  addCat(){S.settings.categories.push({name:'New category',color:COLORS[S.settings.categories.length%COLORS.length]});afterSettings(true)},
  delCat(el){S.settings.categories.splice(Number(el.dataset.i),1);if(!S.settings.categories.length)S.settings.categories.push({name:'Personal',color:'coral'});afterSettings(true)},
  addBlk(){S.settings.blocks.push({start:'18:00',end:'18:30',title:'New block',rem:'',feed:''});afterSettings(true)},
  delBlk(el){S.settings.blocks.splice(Number(el.dataset.i),1);afterSettings(true)}
};
function afterSettings(redraw){
  S.settings.blocks.sort((a,b)=>hm(a.start)-hm(b.start));save('Settings');renderTaskForm();renderAll();if(redraw)renderSettings();
}
const CHG={
  toggleTask(el){const t=task(el.dataset.id);if(!t)return;t.done=el.checked;t.completed=t.done?S.today:'';afterTasks()},
  editTask(el){const t=task(el.dataset.id);if(!t)return;const v=el.value.trim();if(el.dataset.f==='title'&&!v){el.value=t.title;return}t[el.dataset.f]=v;afterTasks()},
  calOn(el){S.settings.calendars[el.dataset.id]=el.checked;save('Settings');refreshAll('cal')},
  goal(el){const n=Math.round(Number(el.value));if(n>0){S.settings.goals[el.dataset.f]=n;save('Settings');renderStats();renderTrackers()}},
  catName(el){const c=S.settings.categories[el.dataset.i],v=el.value.trim();if(!c||!v||v===c.name){el.value=c?c.name:'';return}
    if(S.settings.categories.some(x=>x!==c&&x.name.toLowerCase()===v.toLowerCase())){el.value=c.name;return}
    const old=c.name;S.tasks.forEach(t=>{if(t.category===old)t.category=v});
    S.settings.blocks.forEach(b=>{b.feed=String(b.feed||'').split(',').map(s=>s.trim()).filter(Boolean).map(s=>s.toLowerCase()===old.toLowerCase()?v:s).join(', ')});
    if(S.ui.cat===old)S.ui.cat=v;c.name=v;save('Tasks');afterSettings(true)},
  catColor(el){S.settings.categories[el.dataset.i].color=el.value;afterSettings(true)},
  blk(el){const b=S.settings.blocks[el.dataset.i];if(!b)return;b[el.dataset.f]=el.value.trim();afterSettings(el.dataset.f==='start')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&ACT[el.dataset.act]&&!el.disabled)ACT[el.dataset.act](el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&CHG[el.dataset.chg])CHG[el.dataset.chg](el,e)});
document.addEventListener('submit',e=>{
  e.preventDefault();const id=e.target.id;
  if(id==='taskForm'){const v=$('newTitle').value.trim();if(!v)return;
    S.tasks.push({id:uid(),title:v,category:newCat(),due:$('newDue').value,quadrant:'backlog',done:false,created:S.today,completed:''});
    $('newTitle').value='';$('newDue').value='';afterTasks();$('newTitle').focus()}
  else if(id==='capForm'){const v=$('capText').value.trim();if(!v)return;
    S.notes.push({id:uid(),type:/^https?:\/\/\S+$/i.test(v)?'link':S.ui.cap,text:v,created:S.today});$('capText').value='';save('Notes');renderNotes()}
  else if(id==='focusForm'){const v=$('focusIn').value.trim();if(v)S.focus[S.today]=v;else delete S.focus[S.today];S.editFocus=false;$('focusIn').blur();save('Focus');renderTop()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('settings').hidden)$('settings').hidden=true});
// drag tasks between the backlog and the matrix
let dragId=null;
document.addEventListener('dragstart',e=>{const li=e.target.closest&&e.target.closest('.task[draggable]');if(!li)return;dragId=li.dataset.id;e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';li.classList.add('dragging')});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'))});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('.zone');if(!z||!dragId)return;e.preventDefault();document.querySelectorAll('.zone.over').forEach(x=>x!==z&&x.classList.remove('over'));z.classList.add('over')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('.zone');if(!z||!dragId)return;e.preventDefault();const id=dragId;dragId=null;moveTask(id,z.dataset.zone);renderTasks()});

/* ===================== sample data ===================== */

/* ===================== boot ===================== */
function boot(){
  loadCache();
  if(S.mode==='google'){S.events=LS.get('events',[]);S.calendars=LS.get('cals',[]);S.eventsAt=LS.get('eventsAt',0)}else demoCalendar();
  renderTaskForm();renderAll();
  if(S.mode==='google')refreshAll();
  setInterval(()=>{ // every minute: move the "now" marker, roll the date over at midnight
    const t=ymd(new Date());
    if(t!==S.today){if(S.trackDate===S.today)S.trackDate=t;S.today=t;S.editFocus=false;renderAll();refreshAll()}
    else{renderSchedule();renderMini();renderStats()}
  },60000);
  setInterval(()=>{if(!document.hidden)refreshAll()},5*60000); // every 5 minutes
  let last=Date.now();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-last>60000){last=Date.now();refreshAll()}});
  window.addEventListener('beforeunload',()=>{if(dirty.size&&tokenOk())flush()});
}
boot();
</script>
